; firmware/platformio.ini : sketchs des TP sur NeuroBoard-S3 (ESP32-S3-WROOM-1-N16R8)
;
; Un environnement par sketch. Chaque sketch est dans src/<nom>/.
;   pio run -e tp1_gptimer -t upload
;   pio device monitor
;
; Configuration de la carte reprise de la doc NeuroBoard (docs-NeuroboardS3, page "Prise en main").
; pioarduino est epingle sur une version precise pour un build reproductible.

[platformio]
default_envs = check_board

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

; --- Verification de la carte : flash, PSRAM, LED ---
[env:check_board]
build_src_filter = +<check_board/>

; --- TP 1 ---
[env:tp1_timer_arduino]
build_src_filter = +<tp1_timer_arduino/>

[env:tp1_gptimer]
build_src_filter = +<tp1_gptimer/>

[env:tp1_register_read]
build_src_filter = +<tp1_register_read/>

[env:tp1_paced_adc]
build_src_filter = +<tp1_paced_adc/>

[env:tp1_plotter]
build_src_filter = +<tp1_plotter/>

; --- Camera : capture d'images vers le PC (dataset, TP 7) ---
[env:cam_capture]
build_src_filter = +<cam_capture/>
